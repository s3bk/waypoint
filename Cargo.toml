[workspace]
resolver = "2"
members = ["crates/model", "crates/layout", "crates/server", "crates/mcp", "crates/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
