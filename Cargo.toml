[workspace]
resolver = "2"
members = ["crates/model", "crates/layout", "crates/server", "crates/mcp", "crates/e2e"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sebastian K <s3bk@protonmail.com>"]
repository = "https://github.com/s3bk/waypoint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }

# For the binary shipped to waypoint.qdat.net: `cargo build --profile deploy -p waypoint-server`.
[profile.deploy]
inherits = "release"
lto = "fat"
strip = true
