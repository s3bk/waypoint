[package]
name = "waypoint-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
waypoint-model = { path = "../model" }
waypoint-layout = { path = "../layout" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
yrs = { version = "0.25", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
getrandom = "0.4.3"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip"] }

[dev-dependencies]
tempfile = "3.27.0"
