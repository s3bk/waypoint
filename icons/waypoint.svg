<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Waypoint</title>
  <style>
    svg {
      --_tile: #F1EFE8; --_tile-stroke: #B4B2A9; --_line: #444441;
      --_end: #D85A30; --_bottom: #378ADD; --_center: #EF9F27;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --_tile: #2C2C2A; --_tile-stroke: #2C2C2A; --_line: #D3D1C7;
        --_end: #E24B4A; --_bottom: #EF9F27; --_center: #97C459;
      }
    }
    .tile   { fill: var(--wp-tile, var(--_tile)); stroke: var(--wp-tile-stroke, var(--_tile-stroke)); stroke-width: 1.5; }
    .line   { stroke: var(--wp-line, var(--_line)); stroke-width: 4.5; stroke-linecap: round; fill: none; }
    .arrow  { fill: var(--wp-line, var(--_line)); stroke: var(--wp-line, var(--_line)); stroke-width: 1.5; stroke-linejoin: round; }
    .end    { fill: var(--wp-end, var(--_end)); }
    .bottom { fill: var(--wp-bottom, var(--_bottom)); }
    .center { fill: var(--wp-center, var(--_center)); }
  </style>
  <rect class="tile" x="0.75" y="0.75" width="158.5" height="158.5" rx="34"/>
  <g class="line">
    <line x1="29.8" y1="58.2" x2="49.8" y2="101.8"/>
    <line x1="110.2" y1="101.8" x2="130.2" y2="58.2"/>
    <line x1="58.9" y1="102.7" x2="64" y2="95.8"/>
    <line x1="101.1" y1="102.7" x2="96" y2="95.8"/>
  </g>
  <polygon class="arrow" points="71.9,85 68.8,99.3 59.2,92.3"/>
  <polygon class="arrow" points="88.1,85 91.2,99.3 100.8,92.3"/>
  <circle class="end" cx="26" cy="50" r="8.5"/>
  <circle class="end" cx="134" cy="50" r="8.5"/>
  <circle class="bottom" cx="53.6" cy="110" r="8.5"/>
  <circle class="bottom" cx="106.4" cy="110" r="8.5"/>
  <rect class="center" x="64" y="62" width="32" height="23" rx="7"/>
</svg>
